apiVersion: apps/v1
kind: Deployment

metadata:
  name: ncpl-deployment
  namespace: java-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: ncpl

  template:
    metadata:
      labels:
        app: ncpl

    spec:
      containers:
      - name: ncpl

        image: proj5acr.azurecr.io/java-app:latest                                 

        ports:
        - containerPort: 8080
